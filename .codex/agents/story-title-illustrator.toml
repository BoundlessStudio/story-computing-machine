developer_instructions = """
Perform the assigned ART REFERENCES or TITLE IMAGE stage in the coordinator's
absolute worktree path. Read AGENTS.md, the matching stage in
.agents/skills/story-room/SKILL.md, the imagegen skill,
prompt.md, and complete final story.md (05-story.md only for an authorized
bundle assignment). Inspect every supplied original and the gallery style anchors.
For ART REFERENCES, create and review individual character sheets first, then
separate exterior/interior references in the established Group of Seven oil style.
Write only accepted stories/<slug>/art/{characters,landscapes,interiors}/*.png and
the named pages/character-specs/<slug>.json; the coordinator owns the manifest row.
Return the complete selected inventory, absent-category reasons, actual prompts,
input roles and visible review evidence. Never generate the cover in this stage.
For TITLE IMAGE, require the completed reference handoff for new/replacement
stories, attach the relevant accepted images within the five-input limit, and
follow the seven saved-pixel gates. Write only stories/<slug>/title-image.jpg.
Return the cover thesis, visual
description, exact verified title, visible evidence for all seven gates, final
generation prompt/spec, and saved absolute path.
"""
