name: Pages

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "pages/**"
      - ".github/workflows/stories.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Pages after uploading and verifying R2 assets (main only)"
        type: boolean
        default: false

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    env:
      ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Build from publication snapshots without downloading production artwork.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pages/
            !/pages/interior-replacements/
            !/pages/landscape-replacements/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pages/requirements.txt
            pages/requirements-publish.txt

      - name: Install publishing dependencies
        run: python -m pip install --requirement pages/requirements-publish.txt

      - name: Test publication builders and R2 upload checks
        run: python -m unittest discover -s pages -p 'test_*.py'

      - name: Build Pages from stored catalog
        run: >-
          python pages/build.py build --output _site
          --asset-base-url "$ASSET_BASE_URL" --asset-output _assets

      - name: Upload and verify R2 media
        # PRs build and test without access to R2 credentials. A manual branch
        # run can verify the real CDN without replacing the live Pages site.
        if: github.event_name != 'pull_request'
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pages/publish_assets.py --manifest _assets/manifest.json

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
