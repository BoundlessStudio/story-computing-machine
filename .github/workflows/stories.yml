name: Stories

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Final current-story noun and continuity check
        shell: pwsh
        run: ./.agents/skills/story-room/scripts/Test-Stories.ps1 -Phase Final

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pages/requirements.txt

      - name: Install reader dependency
        run: python -m pip install --requirement pages/requirements.txt

      - name: Check stored Pages catalog and reader
        run: |
          python pages/build.py check
          python -m unittest discover -s pages -p "test_*.py" -v

      - name: Build Pages from stored catalog
        if: github.event_name == 'push'
        run: python pages/build.py build --output _site

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
