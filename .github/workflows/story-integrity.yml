name: Story integrity

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce pull-request chronology and co-changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./.agents/skills/story-integrity/scripts/Test-PullRequestPolicy.ps1 -BaseRef "origin/${{ github.base_ref }}" -HeadRef HEAD -OutputFormat Text
      - name: Run complete PowerShell suite
        shell: pwsh
        run: ./tests/run.ps1
      - name: Validate repository stories
        shell: pwsh
        run: ./.agents/skills/story-integrity/scripts/Test-StoryIntegrity.ps1 -OutputFormat Text