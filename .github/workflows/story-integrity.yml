name: Story integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run executable PowerShell tests
        shell: pwsh
        run: ./tests/run.ps1
      - name: Run focused pipeline contract suites
        shell: pwsh
        run: |
          $suites = @(
            'agent-contract.tests.ps1',
            'authority-manifest.tests.ps1',
            'handoff-guard.tests.ps1',
            'handoff-ledger.tests.ps1',
            'review-contract.tests.ps1',
            'name-gate-hardening.tests.ps1',
            'promotion-manifest.tests.ps1',
            'pipeline-migration.tests.ps1',
            'transaction-integrity.tests.ps1'
          )
          foreach ($suite in $suites) {
            & pwsh -NoLogo -NoProfile -File (Join-Path 'tests' $suite)
            if ($LASTEXITCODE -ne 0) { throw "Focused suite failed: $suite" }
          }
      - name: Validate repository stories
        shell: pwsh
        run: ./.agents/skills/story-integrity/scripts/Test-StoryIntegrity.ps1 -OutputFormat Text
