name: Build and deploy stories to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "stories/**/00-prompt.md"
      - "stories/**/05-story.md"
      - "pages/**"
      - ".github/workflows/static.yml"
  pull_request:
    paths:
      - "stories/**/00-prompt.md"
      - "stories/**/05-story.md"
      - "pages/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pages/requirements.txt

      - name: Install site dependencies
        run: python -m pip install --requirement pages/requirements.txt

      - name: Build story site
        run: python pages/build.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
