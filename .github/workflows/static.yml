name: Build and deploy stories to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "stories/**"
      - "pages/**"
      - ".agents/skills/story-integrity/**"
      - ".agents/skills/story-name-validation/**"
      - ".github/workflows/static.yml"
  pull_request:
    paths:
      - "stories/**"
      - "pages/**"
      - ".agents/skills/story-integrity/**"
      - ".agents/skills/story-name-validation/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate published stories
        shell: pwsh
        run: |
          $validator = Resolve-Path ./.agents/skills/story-integrity/scripts/Test-StoryIntegrity.ps1
          Get-ChildItem ./stories -Directory |
            Where-Object { $_.Name -notmatch '^[_.]' } |
            ForEach-Object {
              $metadataPath = Join-Path $_.FullName story.json
              if (Test-Path -LiteralPath $metadataPath -PathType Leaf) {
                $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
                if ($metadata.publish -eq $true) {
                  $global:LASTEXITCODE = 0
                  & $validator -Story $_.Name
                  if (-not $? -or $LASTEXITCODE -ne 0) {
                    throw "Story integrity failed for $($_.Name)."
                  }
                }
              }
            }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pages/requirements.txt

      - name: Install site dependencies
        run: python -m pip install --requirement pages/requirements.txt

      - name: Test site builder
        run: python -m unittest discover -s pages -p "test_*.py" -v

      - name: Build story site
        run: python pages/build.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
